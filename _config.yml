# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely need to edit after that.
# For technical reasons, this file is *NOT* reloaded automatically when you use
# 'jekyll serve'. If you change this file, please restart the server process.

# Site settings
title: Blog of Leonid Dushin
email: leonid.dushin@gmail.com
description: >
  Personal blog by Leonid Dushin — travel, hiking, books, family, photography,
  and side projects. Bilingual (English and Russian) posts.
lang: en
locale: en_US
# Short phrase for homepage <title>; full site.description stays for meta/OG/snippet text
tagline: Travel, hikes, books, family, photography
baseurl: ""
# Canonical site URL (HTTPS) — used for absolute links, Open Graph, and JSON-LD
url: "https://dushyn.com"

author:
  name: Leonid Dushin
  email: leonid.dushin@gmail.com

social:
  links:
    - https://github.com/Lemik

github_username: Lemik

# Build settings
markdown: kramdown

plugins:
  - jekyll-seo-tag

defaults:
  - scope:
      path: ""
    values:
      image: /images/LD.png

googleAnalitycsID: UA-58426023-1
